name: Refresh promos

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Manila time, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper/build.py
      - name: Publish feed
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add docs/promos.json
          git diff --cached --quiet || git commit -m "Refresh promos" && git push
